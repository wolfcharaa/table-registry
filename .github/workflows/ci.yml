name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring, zip
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run quality gate
        run: composer check

  production-install:
    name: Production install / PHP 8.2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, mbstring, zip
          coverage: none

      - name: Verify package archive without development dependencies
        shell: bash
        run: |
          probe_directory="$(mktemp -d)"
          git archive HEAD | tar -x -C "$probe_directory"
          composer install --working-dir="$probe_directory" --no-dev --prefer-dist --no-interaction --no-progress
          composer check-platform-reqs --working-dir="$probe_directory" --no-dev
